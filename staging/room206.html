    document.querySelectorAll("link[rel~='icon'],link[rel='shortcut icon']").forEach(function (el) {

let chainAngles = [0, 0, 0];

    if (Math.abs(targets[i] - chainAngles[i]) < 0.05) chainAngles[i] = targets[i];
